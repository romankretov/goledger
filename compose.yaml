services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: goledger
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: goledger
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goledger -d goledger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
